name: social_im_demo
description: 跨平台社交 IM App Demo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 路由
  go_router: ^14.0.0

  # IM SDK（融云）
  rongcloud_im_wrapper_flutter: ^6.0.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 网络图片
  cached_network_image: ^3.3.1

  # 图片选择
  image_picker: ^1.0.7

  # 录音 + 播放
  record: ^5.1.2
  audioplayers: ^6.0.0

  # UI 工具
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
